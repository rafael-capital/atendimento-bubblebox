<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Bubble — Sandbox de Teste</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3b82f6;
      --blue-dark: #1e40af;
      --blue-light: #dbeafe;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-chat: #0f172a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --bubble-user: #3b82f6;
      --bubble-agent: #1e293b;
      --border: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .header-info p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge {
      margin-left: auto;
      background: rgba(59, 130, 246, 0.15);
      color: var(--blue);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.agent {
      align-self: flex-start;
    }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
    }

    .message.agent .bubble {
      background: var(--bubble-agent);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message .meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    .message.user .meta { text-align: right; }

    /* Typing indicator */
    .typing {
      align-self: flex-start;
      display: none;
    }

    .typing.active { display: block; }

    .typing .bubble {
      background: var(--bubble-agent);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 14px 20px;
      display: flex;
      gap: 5px;
    }

    .typing .dot {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-area textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 44px;
      transition: border-color 0.2s;
    }

    .input-area textarea:focus {
      border-color: var(--blue);
    }

    .input-area textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--blue);
      border: none;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: var(--blue-dark); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* New chat button */
    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--bg);
      color: var(--text);
      border-color: var(--blue);
    }

    /* Scrollbar */
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 600px) {
      .message { max-width: 88%; }
      .header { padding: 12px 16px; }
      .chat-area { padding: 16px; }
      .input-area { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">🫧</div>
    <div class="header-info">
      <h1>Super Bubble</h1>
      <p>Bubble Box Sorocaba</p>
    </div>
    <button class="new-chat-btn" onclick="newChat()">Nova conversa</button>
    <span class="badge">Sandbox</span>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="typing" id="typing">
      <div class="bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="messageInput"
      placeholder="Digite sua mensagem..."
      rows="1"
      onkeydown="handleKeyDown(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <script>
    let clientId = 'sandbox-' + Date.now();
    let sending = false;

    function newChat() {
      clientId = 'sandbox-' + Date.now();
      document.getElementById('chatArea').innerHTML = `
        <div class="typing" id="typing">
          <div class="bubble">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      `;
    }

    function addMessage(text, role) {
      const chatArea = document.getElementById('chatArea');
      const typing = document.getElementById('typing');

      const div = document.createElement('div');
      div.className = `message ${role}`;

      const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const label = role === 'user' ? 'Você' : 'Super Bubble';

      div.innerHTML = `
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="meta">${label} · ${now}</div>
      `;

      chatArea.insertBefore(div, typing);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setTyping(active) {
      const typing = document.getElementById('typing');
      typing.className = active ? 'typing active' : 'typing';
      if (active) {
        const chatArea = document.getElementById('chatArea');
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    }

    async function sendMessage() {
      if (sending) return;

      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      autoResize(input);
      addMessage(message, 'user');

      sending = true;
      document.getElementById('sendBtn').disabled = true;
      setTyping(true);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, message }),
        });

        const data = await res.json();

        if (data.reply) {
          addMessage(data.reply, 'agent');
        } else if (data.error) {
          addMessage('❌ Erro: ' + data.error, 'agent');
        }
      } catch (err) {
        addMessage('❌ Não consegui conectar ao servidor. Verifique se ele está rodando.', 'agent');
      } finally {
        sending = false;
        document.getElementById('sendBtn').disabled = false;
        setTyping(false);
        input.focus();
      }
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // Focus no input ao carregar
    document.getElementById('messageInput').focus();
  </script>
</body>
</html>
